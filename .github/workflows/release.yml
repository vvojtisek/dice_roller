name: Release

# release-please keeps one open release pull request that bumps version.txt and
# CHANGELOG.md from the Conventional Commit subjects merged since the last
# release. Merging that pull request creates the vX.Y.Z tag and a draft GitHub
# Release. This workflow then builds the APK and AAB from the tagged commit,
# attaches them with SHA-256 checksums and publishes the release.
#
# force-tag-creation in release-please-config.json creates the tag together
# with the draft release; without it GitHub only tags a draft on publish and
# release-please cannot find the release it just made.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Pull requests opened with GITHUB_TOKEN do not trigger other
          # workflows, so the release pull request would never get the
          # required CI checks. A fine-grained token in RELEASE_PLEASE_TOKEN
          # (contents and pull requests: read and write) avoids that.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-and-publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: true
      - name: Check tag
        run: |
          if [[ ! "$TAG_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Unexpected release tag: $TAG_NAME"
            exit 1
          fi
          echo "VERSION=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "SIGNED=false" >> "$GITHUB_ENV"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set. Attaching a debug-signed APK; users must uninstall it before installing a later release signed with a different key. See README.md, 'Signing releases'."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          echo "SIGNED=true" >> "$GITHUB_ENV"
      - name: Build signed release APK and AAB
        if: env.SIGNED == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/dice-roller-$VERSION.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/dice-roller-$VERSION.aab"
      - name: Build debug-signed APK (no signing key configured)
        if: env.SIGNED != 'true'
        run: |
          ./gradlew assembleDebug
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/dice-roller-$VERSION-debug.apk"
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - name: Attach artifacts and publish the release
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          gh release upload "$TAG_NAME" * --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG_NAME" --draft=false --latest --repo "$GITHUB_REPOSITORY"
